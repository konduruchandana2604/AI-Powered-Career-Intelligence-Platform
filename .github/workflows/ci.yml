name: CareerCast CI Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  validate:
    name: Validate CareerCast
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # STEP 1 - CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # STEP 2 - PYTHON
      # ==========================================================

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ==========================================================
      # STEP 3 - INSTALL DEPENDENCIES
      # ==========================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      # ==========================================================
      # STEP 4 - VERIFY PYTHON FILES
      # ==========================================================

      - name: Compile Python files
        run: |
          python -m py_compile api.py
          python -m py_compile app.py
          python -m py_compile career_recommendation_engine.py
          python -m py_compile accuracy_gate.py
          python -m py_compile mlflow_tracking.py


      # ==========================================================
      # STEP 5 - VERIFY FASTAPI IMPORT
      # ==========================================================

      - name: Test FastAPI application
        run: |
          python -c "from api import app; print('FastAPI import: OK')"


      # ==========================================================
      # STEP 6 - VERIFY RECOMMENDATION ENGINE
      # ==========================================================

      - name: Test recommendation engine
        run: |
          python -c "from career_recommendation_engine import recommend_careers; print('Recommendation engine import: OK')"


      # ==========================================================
      # STEP 7 - RUN ACCURACY GATE
      # ==========================================================

      - name: Run accuracy gate
        run: |
          python accuracy_gate.py


      # ==========================================================
      # STEP 8 - SHOW GATE REPORT
      # ==========================================================

      - name: Display accuracy gate report
        if: always()
        run: |
          if [ -f models/accuracy_gate_report.json ]; then
            cat models/accuracy_gate_report.json
          else
            echo "Accuracy gate report not found."
          fi


      # ==========================================================
      # STEP 9 - UPLOAD REPORT
      # ==========================================================

      - name: Upload accuracy gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-gate-report
          path: models/accuracy_gate_report.json
          if-no-files-found: warn