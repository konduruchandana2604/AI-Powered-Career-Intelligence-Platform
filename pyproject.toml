[build-system]
requires = ["setuptools>=61.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "careercast"
version = "1.0.0"
description = "AI-Powered Career Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "Flask",
    "flask-cors",
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "joblib",
    "spacy",
    "python-multipart",
    "fastapi",
    "uvicorn",
    "pydantic"
]

[project.scripts]
careercast = "careercast.cli:main"

[tool.setuptools.packages.find]
include = ["careercast*"]